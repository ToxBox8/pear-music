name: Android

on:
  push:
    paths:
      - "apps/android/**"
      - "shared/design/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "shared/design/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Versión para el nombre del archivo (p. ej. 0.1.0)"
        type: string
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Tokens de diseño sincronizados
        working-directory: .
        run: python3 shared/design/gen_tokens.py --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Tests unitarios
        shell: bash
        run: |
          set -o pipefail
          gradle testUsrDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            # Los errores de compilación como anotaciones (se leen desde la API sin abrir el log).
            grep -E '^e: |error:|FAILED' "$RUNNER_TEMP/test.log" | head -200 | sed 's/^/::error::/'
            exit 1
          }

      - name: Publicar capturas de pantalla
        if: always() && github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          shopt -s nullglob
          files=(apps/android/app/build/shots/*.png)
          [ ${#files[@]} -eq 0 ] && { echo "Sin capturas"; exit 0; }
          mkdir -p "$RUNNER_TEMP/shots" && cp "${files[@]}" "$RUNNER_TEMP/shots/"
          cd "$RUNNER_TEMP" && rm -rf pub && mkdir pub && cd pub
          git init -q && git checkout -q -b screenshots
          cp "$RUNNER_TEMP"/shots/*.png .
          git add . && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots

      - name: Preparar clave de firma
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Aviso de firma de depuración
        if: env.KEYSTORE_B64 == ''
        run: |
          echo "::warning::Sin secretos de firma, el APK se firma con una clave de depuración (solo para pruebas). Ver docs/RELEASING.md."

      - name: Compilar APK de release
        shell: bash
        run: |
          set -o pipefail
          gradle assembleUsrRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E '^e: |error:|FAILED|R8' "$RUNNER_TEMP/build.log" | head -200 | sed 's/^/::error::/'
            exit 1
          }

      - name: Nombrar el APK
        id: apk
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/usr/release/app-usr-release.apk "dist/LibreMusic-android-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: LibreMusic-android
          path: apps/android/dist/
          if-no-files-found: error
