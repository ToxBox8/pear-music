name: iOS (sintaxis)

# Comprobación barata en Linux en cada push que toca iOS (cualquier rama): swiftc -parse de todo Sources.
# No comprueba tipos de SwiftUI (sólo existen en Apple); eso lo hace ios.yml en macOS.
on:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-sintaxis.yml"
  workflow_dispatch:

concurrency:
  group: ios-sintaxis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7
      - name: Sintaxis de Swift
        working-directory: apps/ios
        run: swiftc -parse Sources/*.swift && echo "Sintaxis correcta en $(ls Sources/*.swift | wc -l) archivos."
