<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1B8F"/>
      <stop offset="0.5" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE4FF"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="512" cy="512" r="330"/></clipPath>
  </defs>

  <!-- Renderizado a PNG con render_icon.py. fondo: degradado + manchas de luz como el fondo glass de la app -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="210" cy="230" r="300" fill="#4D6BFF" opacity="0.85"/>
    <circle cx="860" cy="360" r="260" fill="#EC4899" opacity="0.75"/>
    <circle cx="640" cy="900" r="320" fill="#F59E0B" opacity="0.80"/>
    <circle cx="150" cy="860" r="220" fill="#B44CFF" opacity="0.6"/>
  </g>

  <!-- disco de cristal -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="330" fill="url(#glass)"/>
    <g clip-path="url(#disc)" opacity="0.55">
      <ellipse cx="420" cy="300" rx="300" ry="150" fill="#FFFFFF" opacity="0.22" filter="url(#soft)"/>
    </g>
    <circle cx="512" cy="512" r="328" fill="none" stroke="url(#rim)" stroke-width="5"/>
  </g>

  <!-- nota musical cuya cabeza es una bobina de casete -->
  <g filter="url(#shadow)" transform="translate(-22 -14)">
    <!-- plica y bandera -->
    <rect x="574" y="282" width="34" height="330" rx="17" fill="url(#note)"/>
    <path d="M591 282 C 660 300, 720 340, 712 430 C 700 395, 660 372, 600 370 Z" fill="url(#note)"/>
    <!-- bobina: disco claro con el buje de 6 dientes de un casete -->
    <circle cx="482" cy="640" r="128" fill="url(#note)"/>
    <circle cx="482" cy="640" r="120" fill="none" stroke="#4C1D95" stroke-opacity="0.18" stroke-width="6"/>
    <circle cx="482" cy="640" r="64" fill="#4C1D95"/>
    <rect x="474" y="578" width="16" height="26" rx="5" fill="url(#note)" transform="rotate(0 482 640)"/>
    <rect x="474" y="578" width="16" height="26" rx="5" fill="url(#note)" transform="rotate(60 482 640)"/>
    <rect x="474" y="578" width="16" height="26" rx="5" fill="url(#note)" transform="rotate(120 482 640)"/>
    <rect x="474" y="578" width="16" height="26" rx="5" fill="url(#note)" transform="rotate(180 482 640)"/>
    <rect x="474" y="578" width="16" height="26" rx="5" fill="url(#note)" transform="rotate(240 482 640)"/>
    <rect x="474" y="578" width="16" height="26" rx="5" fill="url(#note)" transform="rotate(300 482 640)"/>
  </g>
</svg>
