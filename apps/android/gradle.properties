# Memoria contenida: el PC de desarrollo tiene 15 GB y comparte con el navegador y otras apps (14-10-2026 se quedó
# sin memoria con los tests de capturas y tres releases a la vez).
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
