[versions]
agp = "9.1.0"
kotlin = "2.4.0"
coreKtx = "1.15.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2026.08.00"
media3 = "1.5.1"
junit = "4.13.2"
okhttp = "4.12.0"
coil = "2.7.0"
coroutines = "1.9.0"
orgJson = "20240303"
zxing = "3.5.3"
zxingEmbedded = "4.3.0"
robolectric = "4.17"
# Vidrio de la barra estilo SimpMusic (Kyant, Apache-2.0); exige Compose 1.12 y Kotlin 2.4.
backdrop = "2.0.1"
constraintlayoutCompose = "1.1.1"
materialIcons = "1.7.8"
roborazzi = "1.39.0"
# Avisos en segundo plano (comprobar cada 15 min).
work = "2.11.2"
# Verificar la firma Ed25519 del estado de incidencias en Android 8–12 (Fase 4). Sin vulnerabilidades conocidas (OSV).
bouncycastle = "1.86"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
