name: LibreMusic
options:
  bundleIdPrefix: com.example
# Tres apps con el mismo código (Fase 1 de la 2.0, ver docs/FLAVORS.md): Debug/Release son la pública (usr);
# Pref y Dev, las de Toxbox, que no se publican. Cada una toma su bundle id, nombre y canal de Config/*.xcconfig.
configs:
  Debug: debug
  Release: release
  Pref: release
  Dev: release
configFiles:
  Debug: Config/Usr.xcconfig
  Release: Config/Usr.xcconfig
  Pref: Config/Pref.xcconfig
  Dev: Config/Dev.xcconfig
targets:
  LibreMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # Versión de la app (ver docs/RELEASING.md). Súbela en cada versión publicada.
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "12"
        UILaunchScreen: {}
        # fetch: comprobar los avisos en segundo plano (BGAppRefreshTask, ver Avisos.swift).
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.libremusic.avisos]
        NSAppleMusicUsageDescription: Pear Music lee tus playlists de Apple Music para importarlas.
        NSLocalNetworkUsageDescription: Pear Music busca a tus amigos en la misma red para hacer un Jam juntos.
        NSBonjourServices:
          - _lm-jam._tcp
          - _lm-jam._udp
          - _lm-jam2._tcp
        # Para que el aviso de versión nueva pueda abrir AltStore o SideStore (Updates.swift).
        LSApplicationQueriesSchemes: [altstore, sidestore]
        NSCameraUsageDescription: Pear Music usa la cámara para escanear el código QR de un Jam.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.libremusic
            CFBundleURLSchemes: [libremusic]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# Un scheme por canal. `LibreMusic` es la pública y el que usan la CI y la release (no cambia de nombre).
schemes:
  LibreMusic:
    build:
      targets:
        LibreMusic: all
    run:
      config: Debug
    archive:
      config: Release
  Pear Pref:
    build:
      targets:
        LibreMusic: all
    run:
      config: Pref
    archive:
      config: Pref
  Pear Dev:
    build:
      targets:
        LibreMusic: all
    run:
      config: Dev
    archive:
      config: Dev
