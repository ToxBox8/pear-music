name: LibreMusic
options:
  bundleIdPrefix: com.example
# Tres apps con el mismo código (Fase 1 de la 2.0, ver docs/FLAVORS.md): Debug/Release son la pública (usr);
# Pref y Dev, las de Toxbox, que no se publican. Cada una toma su bundle id, nombre y canal de Config/*.xcconfig.
configs:
  Debug: debug
  Release: release
  Pref: release
  Dev: release
configFiles:
  Debug: Config/Usr.xcconfig
  Release: Config/Usr.xcconfig
  Pref: Config/Pref.xcconfig
  Dev: Config/Dev.xcconfig
targets:
  LibreMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # Versión de la app (ver docs/RELEASING.md). Súbela en cada versión publicada.
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "16"
        # Versión completa con la beta (AppVersion.swift): la que enseña y compara la app. Sin beta, igual a la de arriba.
        JiyuVersion: "3.0.0-beta.1"
        UILaunchScreen: {}
        # fetch: comprobar los avisos en segundo plano (BGAppRefreshTask, ver Avisos.swift).
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.libremusic.avisos]
        NSAppleMusicUsageDescription: Jiyu Pulse lee tus playlists de Apple Music para importarlas.
        NSLocalNetworkUsageDescription: Jiyu Pulse busca a tus amigos en la misma red para hacer un Jam juntos.
        NSBonjourServices:
          - _lm-jam._tcp
          - _lm-jam._udp
          - _lm-jam2._tcp
        # Para que el aviso de versión nueva pueda abrir AltStore o SideStore (Updates.swift).
        LSApplicationQueriesSchemes: [altstore, sidestore]
        NSCameraUsageDescription: Jiyu Pulse usa la cámara para escanear el código QR de un Jam.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.libremusic
            CFBundleURLSchemes: [libremusic]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON_NAME)
      # Portadas del modo demo (DemoCatalog.swift): sólo en Debug (simulador de la CI) y Jiyu Dev, nunca en la pública.
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "demo-*.jpg"
        Pref:
          EXCLUDED_SOURCE_FILE_NAMES: "demo-*.jpg"

  # Tests de interfaz (XCUITest) en el simulador: scripts/uitests.sh y el job «uitests» de ios.yml. No van en el .ipa.
  LibreMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources: [UITests]
    dependencies:
      - target: LibreMusic
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LibreMusic

# Un scheme por canal. `LibreMusic` es la pública y el que usan la CI y la release (no cambia de nombre).
schemes:
  LibreMusic:
    build:
      targets:
        LibreMusic: all
    run:
      config: Debug
    archive:
      config: Release
  Pear Pref:
    build:
      targets:
        LibreMusic: all
    run:
      config: Pref
    archive:
      config: Pref
  Pear Dev:
    build:
      targets:
        LibreMusic: all
    run:
      config: Dev
    archive:
      config: Dev
  # Sólo para los tests de interfaz; `LibreMusic` se queda sin tests para que la compilación del .ipa no cambie.
  LibreMusicUITests:
    build:
      targets:
        LibreMusic: all
        LibreMusicUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LibreMusicUITests
